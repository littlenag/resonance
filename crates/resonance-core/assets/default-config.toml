# Resonance repository configuration (.resonance/config.toml). Written by `resonance init`;
# committed from stage 2, when it is shared with the team.

[repository]
# The adoption stage: 1 offline trial, 2 shared (written by `resonance share`).
stage = 1
# The oldest resonance version that may write this repository's data (FR-264).
minVersion = ""

[intent]
# Requirement documents imported with `resonance import` (MVP-011).
sources = []

[ingest]
# Extra ignore patterns, on top of .gitignore and the built-in defaults (FR-046).
ignore = []
# Files larger than this are recorded by hash and size only (MVP-016).
maxBlobBytes = 5242880
# Read `@satisfies FR-042` / `@verifies FR-042` tags from file text (FR-123).
sourceTags = false

[test]
# Fallback for tests declared without --run; {name}, {path} and {address} are substituted (MVP-017).
command = ""
# Output that means no test actually ran; such a run is recorded as `error`, never `pass`.
zeroTestsPattern = "running 0 tests"
# Seconds before a test run is stopped and recorded as `error`.
timeoutSeconds = 600

[daemon]
# Seconds without requests after which the daemon exits (FR-084).
idleSeconds = 1800

[compaction]
# Compact when the trunk has this many sealed deltas (FR-154).
maxDeltas = 100
# The trunk; empty means the remote's default branch, else main, else master (FR-155).
trunk = ""

[governance]
# Path globs Resonance governs (FR-178); empty means everything.
paths = []

[changes]
# Also log changes made by agents in the change log (FR-274).
includeAgents = false
