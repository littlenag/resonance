<h1>Resonance</h1>
<p>This <code>resonance</code> binary was built without its web UI.</p>
<p>Build the UI with <code>just ui-build</code> (or <code>just build</code>), rebuild the binary, and run <code>resonance ui</code> again.</p>
<p>The daemon and its API are running; the TUI (<code>resonance tui</code>) works as usual.</p>
