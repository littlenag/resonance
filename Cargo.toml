[workspace]
resolver = "3"
members = [
    "crates/resonance-core",
    "crates/resonance-store-sqlite",
    "crates/resonance-cli",
    "crates/resonance-store-memory",
    "crates/resonance-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/littlenag/resonance"
publish = false   # license is still open (OQ-15); crates.io comes later (§13.1)

[workspace.dependencies]
resonance-core = { path = "crates/resonance-core" }
resonance-store-sqlite = { path = "crates/resonance-store-sqlite" }
resonance-store-memory = { path = "crates/resonance-store-memory" }
resonance-web = { path = "crates/resonance-web" }

# Third-party dependencies (MVP-006), pinned here and inherited by the crates.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.20"
notify = "8.2.0"
# The TUI (MVP-041); crossterm comes through `ratatui::crossterm`.
ratatui = "0.30.2"
ignore = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
# The web UI's server (MVP-043): synchronous, like the daemon's socket listener.
tiny_http = "0.12.0"
toml = "1.1.8"
# The daemon's log (MVP-044).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
ulid = "3.0.0"
